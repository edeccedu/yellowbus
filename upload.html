<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃色巴士大巡遊 - 觀眾上傳與手繪工作坊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fef9e7; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #333; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #f57f17; margin-bottom: 8px; font-size: 26px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 15px; }

        .section { background: #fffde7; border: 2px dashed #fbc02d; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #f57f17; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #555; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        input[type="text"]:focus { border-color: #fbc02d; outline: none; }

        .paint-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background: white; border: 3px solid #ffb300; border-radius: 12px; overflow: hidden; touch-action: none; cursor: crosshair; }
        canvas#paintCanvas { width: 100%; height: 100%; display: block; }

        .tools-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; justify-content: space-between; }
        .colors { display: flex; gap: 8px; }
        .color-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
        .color-btn.active { transform: scale(1.15); border-color: #333; }

        .btn { background: #fbc02d; color: #000; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(251, 192, 45, 0.4); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background: #f57f17; color: white; transform: translateY(-2px); }
        .btn-green { background: #66bb6a; color: white; box-shadow: 0 4px 10px rgba(102, 187, 106, 0.4); width: 100%; margin-top: 15px; font-size: 18px; padding: 15px; }
        .btn-green:hover { background: #43a047; }
        .btn-secondary { background: #e0e0e0; color: #333; padding: 8px 16px; font-size: 14px; }

        .success-banner { display: none; background: #e8f5e9; border: 2px solid #66bb6a; color: #2e7d32; padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .success-banner h3 { font-size: 22px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚌 黃色巴士上傳與手繪工作坊</h1>
    <p class="subtitle">為您的黃色校車塗上色彩，或拍照上傳，即刻加入大銀幕巡遊！</p>

    <div class="form-group">
        <label for="busName">🏷️ 輸入您的巴士名稱 / 車主姓名：</label>
        <input type="text" id="busName" placeholder="例如：快樂陽光號 (陳小明)" maxlength="20">
    </div>

    <div class="section">
        <h2>🎨 手機即時手繪校車</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">在下方黃色校車上自由畫上圖案與色彩（支援手指觸控或滑鼠）！</p>
        
        <div class="paint-container">
            <canvas id="paintCanvas"></canvas>
        </div>

        <div class="tools-bar">
            <div class="colors">
                <div class="color-btn active" style="background: #e53935;" onclick="setPenColor('#e53935', this)"></div>
                <div class="color-btn" style="background: #1e88e5;" onclick="setPenColor('#1e88e5', this)"></div>
                <div class="color-btn" style="background: #43a047;" onclick="setPenColor('#43a047', this)"></div>
                <div class="color-btn" style="background: #fb8c00;" onclick="setPenColor('#fb8c00', this)"></div>
                <div class="color-btn" style="background: #8e24aa;" onclick="setPenColor('#8e24aa', this)"></div>
                <div class="color-btn" style="background: #212121;" onclick="setPenColor('#212121', this)"></div>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="clearCanvas()">🗑️ 清除重畫</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>📷 或上傳自訂圖片</h2>
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 10px; width: 100%;">
    </div>

    <button class="btn btn-green" id="submitBtn" onclick="submitBusToParade()">🚀 發射巴士加入大銀幕巡遊！</button>

    <div id="successBanner" class="success-banner">
        <h3>🎉 發射成功！</h3>
        <p>您的專屬黃色校車已經順利透過雲端飛上大銀幕賽道！</p>
        <button class="btn" style="margin-top: 15px;" onclick="resetForm()">再發射一輛</button>
    </div>
</div>

<!-- Firebase SDK 模組引入 -->

    const internalW = 800;

    canvas.width = internalW;

    let isDrawing = false;
    let penColor = '#e53935';
    let penWidth = 10;
    let customImageBase64 = null;

    function drawBusTemplate() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, internalW, internalH);

        ctx.save();
        ctx.translate(internalW / 2, internalH / 2);
        ctx.scale(1.8, 1.8);

        ctx.fillStyle = '#546e7a';
        ctx.beginPath(); ctx.roundRect(-50, -60, 130, 14, 4); ctx.fill();

        ctx.fillStyle = '#fffde7';
        ctx.beginPath();
        ctx.moveTo(-90, 45); ctx.lineTo(-90, 20); ctx.lineTo(-100, -5);
        ctx.lineTo(-75, -45); ctx.lineTo(80, -48);
        ctx.quadraticCurveTo(105, -48, 105, -20); ctx.lineTo(105, 45);
        ctx.closePath(); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#37474f'; ctx.stroke();

        ctx.fillStyle = '#4e342e';
        ctx.fillRect(-90, 5, 200, 7);
        ctx.fillRect(-90, 20, 200, 6);

        ctx.fillStyle = '#e1f5fe';
        ctx.beginPath(); ctx.moveTo(-73, -40); ctx.lineTo(-52, -40); ctx.lineTo(-52, 2); ctx.lineTo(-88, 2); ctx.closePath();
        ctx.fill(); ctx.stroke();

        [-40, -10, 20, 50].forEach(wx => {
            ctx.fillRect(wx, -38, 24, 26);
            ctx.strokeRect(wx, -38, 24, 26);
        });

        ctx.fillStyle = '#37474f';
        ctx.fillRect(-85, -30, 8, 18);
        ctx.fillRect(-89, -35, 12, 6);
        ctx.fillRect(-102, 45, 207, 7);

        [-55, 55].forEach(wx => {
            ctx.fillStyle = '#212121';
            ctx.beginPath(); ctx.arc(wx, 50, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(wx, 50, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        });

        ctx.restore();
    }

    drawBusTemplate();

    window.setPenColor = function(color, btn) {
        penColor = color;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    };

    window.clearCanvas = function() {
        ctx.clearRect(0, 0, internalW, internalH);
        drawBusTemplate();
        customImageBase64 = null;
    };

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getCanvasPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const p = getCanvasPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = penColor; ctx.lineWidth = penWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    });
    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; const p = getCanvasPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
