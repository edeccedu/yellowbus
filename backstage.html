<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃色巴士大巡遊 - 後台控制中心</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #e0e0e0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #ffeb3b; text-align: center; margin-bottom: 20px; font-size: 26px; }

        .card { background: #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #444; }
        h2 { font-size: 18px; color: #ffca28; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        label { font-weight: bold; font-size: 15px; }
        input[type="range"] { flex: 1; margin: 0 15px; accent-color: #ffeb3b; height: 8px; }
        span.value-badge { background: #ffeb3b; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; min-width: 60px; text-align: center; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .btn { background: #ffeb3b; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:hover { background: #fbc02d; transform: translateY(-2px); }
        .btn-danger { background: #e53935; color: white; }
        .btn-danger:hover { background: #c62828; }
        .btn-secondary { background: #424242; color: white; }
        .btn-secondary:hover { background: #616161; }

        .bus-list { max-height: 350px; overflow-y: auto; margin-top: 10px; border: 1px solid #444; border-radius: 8px; }
        .bus-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #333; background: #242424; }
        .bus-item:hover { background: #2f2f2f; }
        .bus-info { display: flex; align-items: center; gap: 12px; }
        .bus-thumb { width: 50px; height: 30px; object-fit: contain; background: #333; border-radius: 4px; border: 1px solid #555; }
        
        .link-box { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #444; word-break: break-all; font-family: monospace; font-size: 14px; color: #ffeb3b; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎛️ 黃色巴士大巡遊 ｜ 後台控制中心 (雲端版)</h1>

    <div class="card">
        <h2>🔗 頁面快速連結 (複製給手機觀眾掃碼上傳)</h2>
        <div style="margin-bottom: 8px;">
            <strong>🖥️ 大銀幕播放端網址：</strong>
            <div class="link-box" id="screenLink">index.html</div>
        </div>
        <div>
            <strong>📱 觀眾上傳頁面網址：</strong>
            <div class="link-box" id="uploadLink">upload.html</div>
        </div>
    </div>

    <div class="card">
        <h2>⚡ 巡遊動態控制</h2>
        
        <div class="control-row">
            <label>行駛速度：</label>
            <input type="range" id="speedRange" min="0" max="6.0" step="0.2" value="1.5" oninput="updateSettings()">
            <span class="value-badge" id="speedVal">1.5x</span>
        </div>

        <div class="control-row">
            <label>場上最大巴士數量：</label>
            <input type="range" id="maxBusesRange" min="1" max="30" step="1" value="12" oninput="updateSettings()">
            <span class="value-badge" id="maxBusesVal">12 輛</span>
        </div>

        <div class="control-row">
            <label>巴士顯示大小：</label>
            <input type="range" id="sizeRange" min="0.5" max="1.8" step="0.1" value="1.0" oninput="updateSettings()">
            <span class="value-badge" id="sizeVal">1.0x</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="setSpeed(0)">⏸️ 暫停</button>
            <button class="btn btn-secondary" onclick="setSpeed(1.0)">▶️ 標準 1.0x</button>
            <button class="btn btn-secondary" onclick="setSpeed(2.5)">🚀 快速 2.5x</button>
            <button class="btn btn-secondary" onclick="setSpeed(5.0)">🔥 飛快 5.0x</button>
        </div>
    </div>

    <div class="card">
        <h2>🚌 現有車隊清單管理 (<span id="totalBusesCount">0</span> 輛)</h2>
        <div class="btn-group" style="margin-bottom: 12px;">
            <button class="btn" onclick="addDemoBus()">＋ 新增一輛示範巴士</button>
            <button class="btn btn-danger" onclick="clearAllBuses()">🗑️ 清空全部巴士</button>
        </div>
        <div class="bus-list" id="busListContainer"></div>
    </div>
</div>

<!-- Firebase SDK 模組引入 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC64OxwmFLAwmzcnl_BQaXM-_mC6PTFWHM",
        authDomain: "yellowbus-12d4a.firebaseapp.com",
        projectId: "yellowbus-12d4a",
        storageBucket: "yellowbus-12d4a.firebasestorage.app",
        messagingSenderId: "320843319933",
        appId: "1:320843319933:web:86cc6e3a673baaccb57f14",
        measurementId: "G-3KBP4ZWSBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const currentUrl = window.location.href;
    const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
    document.getElementById('screenLink').innerText = baseUrl + 'index.html';
    document.getElementById('uploadLink').innerText = baseUrl + 'upload.html';

    let currentSettings = { speed: 1.5, maxBuses: 12, busSize: 1.0 };
    let buses = [];

    // 監聽設定
    onSnapshot(doc(db, "settings", "global"), (docSnap) => {
        if (docSnap.exists()) {
            currentSettings = docSnap.data();
            document.getElementById('speedRange').value = currentSettings.speed ?? 1.5;
            document.getElementById('speedVal').innerText = (currentSettings.speed ?? 1.5) + 'x';
            document.getElementById('maxBusesRange').value = currentSettings.maxBuses ?? 12;
            document.getElementById('maxBusesVal').innerText = (currentSettings.maxBuses ?? 12) + ' 輛';
            document.getElementById('sizeRange').value = currentSettings.busSize ?? 1.0;
            document.getElementById('sizeVal').innerText = (currentSettings.busSize ?? 1.0) + 'x';
        }
    });

    // 監聽車隊
    onSnapshot(collection(db, "buses"), (snapshot) => {
        buses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderBusList();
    });

    window.updateSettings = async function() {
        currentSettings.speed = parseFloat(document.getElementById('speedRange').value);
        currentSettings.maxBuses = parseInt(document.getElementById('maxBusesRange').value);
        currentSettings.busSize = parseFloat(document.getElementById('sizeRange').value);

        document.getElementById('speedVal').innerText = currentSettings.speed + 'x';
        document.getElementById('maxBusesVal').innerText = currentSettings.maxBuses + ' 輛';
        document.getElementById('sizeVal').innerText = currentSettings.busSize + 'x';

        await setDoc(doc(db, "settings", "global"), currentSettings, { merge: true });
    };

    window.setSpeed = function(spd) {
        document.getElementById('speedRange').value = spd;
        updateSettings();
    };

    function renderBusList() {
        const container = document.getElementById('busListContainer');
        document.getElementById('totalBusesCount').innerText = buses.length;
        if (buses.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: #777;">目前雲端沒有巴士在場上</div>';
            return;
        }

        container.innerHTML = buses.map((bus) => `
            <div class="bus-item">
                <div class="bus-info">
                    <img src="${bus.imgUrl || ''}" class="bus-thumb" onerror="this.style.display='none'">
                    <div>
                        <strong>${bus.name}</strong>
                        <div style="font-size: 12px; color: #aaa;">狀態: ${bus.hidden ? '已隱藏' : '行駛中'}</div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="focusBus('${bus.id}')">✨ 特寫</button>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="toggleHideBus('${bus.id}', ${bus.hidden})">${bus.hidden ? '顯示' : '隱藏'}</button>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteBus('${bus.id}')">刪除</button>
                </div>
            </div>
        `).join('');
    }

    window.focusBus = async function(id) {
        await setDoc(doc(db, "settings", "global"), { ...currentSettings, focusedBusId: id, focusTimestamp: Date.now() }, { merge: true });
    };

    window.toggleHideBus = async function(id, currentHidden) {
        await updateDoc(doc(db, "buses", id), { hidden: !currentHidden });
    };

    window.deleteBus = async function(id) {
        await deleteDoc(doc(db, "buses", id));
    };

    window.clearAllBuses = async function() {
        if (confirm('確定要清空雲端上所有巴士嗎？')) {
            const snapshot = await getDocs(collection(db, "buses"));
            const batchDeletes = snapshot.docs.map(d => deleteDoc(doc(db, "buses", d.id)));
            await Promise.all(batchDeletes);
        }
    };

    window.addDemoBus = async function() {
        const names = ['快樂校車', '陽光號', '友愛快車', '微笑巴士', '閃電小黃', '社區同心號'];
        await addDoc(collection(db, "buses"), {
            name: names[Math.floor(Math.random() * names.length)] + ' (' + Math.floor(Math.random() * 90 + 10) + ')',
            dist: Math.random() * 0.8,
            speedMul: 0.9 + Math.random() * 0.3,
            color: '#fbc02d',
            imgUrl: null,
            hidden: false,
            createdAt: Date.now()
        });
    };
</script>
</body>
</html>
