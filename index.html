<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃色巴士大巡遊 - 大銀幕展示端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b1329; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
        
        /* 16:9 劇場置中舞台容器 */
        #stage-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            max-height: 100vh;
            max-width: 177.78vh;
            transform: translate(-50%, -50%);
            background: #87CEEB;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        @media (min-aspect-ratio: 16/9) {
            #stage-container { width: 177.78vh; height: 100vh; }
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* 頂部導覽列 / 狀態列 */
        .top-bar {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .badge {
            background: rgba(0, 0, 0, 0.6);
            color: #ffeb3b;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 235, 59, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .nav-links { pointer-events: auto; display: flex; gap: 10px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .nav-btn:hover { background: #ffeb3b; color: #000; transform: translateY(-2px); }

        /* 全螢幕提示按鈕 */
        .fs-btn {
            position: absolute;
            bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.6);
            color: white; border: 2px solid white;
            padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 16px;
            z-index: 10; backdrop-filter: blur(5px);
        }
        .fs-btn:hover { background: white; color: black; }
    </style>
</head>
<body>

<div id="stage-container">
    <div class="top-bar">
        <div class="badge">🚌 黃色巴士大巡遊 ｜ 大銀幕展示</div>
        <div class="nav-links">
            <a href="upload.html" target="_blank" class="nav-btn">📱 觀眾上傳頁面</a>
            <a href="backstage.html" target="_blank" class="nav-btn">🎛️ 後台控制台</a>
        </div>
    </div>

    <canvas id="trackCanvas"></canvas>

    <button class="fs-btn" onclick="toggleFullScreen()">⛶ 全螢幕播放</button>
</div>

<script>
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');

    // 固定 16:9 內部解析度 1920x1080
    const LOGICAL_WIDTH = 1920;
    const LOGICAL_HEIGHT = 1080;
    canvas.width = LOGICAL_WIDTH;
    canvas.height = LOGICAL_HEIGHT;

    // 狀態同步與廣播
    const bc = new BroadcastChannel('bus_parade_channel');
    let busSpeed = 1.0;
    let maxBuses = 12;
    let busSizeScale = 1.0;
    let focusedBusId = null;
    let focusTimer = 0;

    let buses = [];

    // 預設示範巴士資料（精準匹配黃色校車圖片外觀）
    function createDefaultBuses() {
        return [
            { id: 'demo_1', name: '陳小明的校車', dist: 0.0, speedMul: 1.0, color: '#fbc02d', imgUrl: null, hidden: false },
            { id: 'demo_2', name: '開心快樂號', dist: 0.15, speedMul: 0.95, color: '#ffb300', imgUrl: null, hidden: false },
            { id: 'demo_3', name: '陽光寶寶巴士', dist: 0.30, speedMul: 1.05, color: '#fdd835', imgUrl: null, hidden: false },
            { id: 'demo_4', name: '林美玲的夢想號', dist: 0.45, speedMul: 0.9, color: '#ffca28', imgUrl: null, hidden: false },
            { id: 'demo_5', name: '社區關懷號', dist: 0.60, speedMul: 1.0, color: '#ffb300', imgUrl: null, hidden: false },
            { id: 'demo_6', name: '黃伯伯特快車', dist: 0.75, speedMul: 1.1, color: '#fbc02d', imgUrl: null, hidden: false }
        ];
    }

    function loadBusesFromStorage() {
        const saved = localStorage.getItem('bus_parade_list');
        if (saved) {
            try { buses = JSON.parse(saved); } catch(e) { buses = createDefaultBuses(); }
        } else {
            buses = createDefaultBuses();
            saveBusesToStorage();
        }
    }

    function saveBusesToStorage() {
        localStorage.setItem('bus_parade_list', JSON.stringify(buses));
        bc.postMessage({ type: 'UPDATE_BUSES', buses });
    }

    loadBusesFromStorage();

    // 接收控制台指令
    bc.onmessage = (event) => {
        const data = event.data;
        if (!data) return;
        if (data.type === 'UPDATE_SETTINGS') {
            if (data.speed !== undefined) busSpeed = data.speed;
            if (data.maxBuses !== undefined) maxBuses = data.maxBuses;
            if (data.busSize !== undefined) busSizeScale = data.busSize;
        } else if (data.type === 'UPDATE_BUSES') {
            buses = data.buses;
        } else if (data.type === 'FOCUS_BUS') {
            focusedBusId = data.busId;
            focusTimer = 360; // 6秒特效
        } else if (data.type === 'ADD_BUS') {
            buses.push(data.bus);
            if (buses.length > maxBuses) buses.shift();
            saveBusesToStorage();
        }
    };

    // 讀取設定
    const savedSettings = localStorage.getItem('bus_parade_settings');
    if (savedSettings) {
        try {
            const st = JSON.parse(savedSettings);
            busSpeed = st.speed ?? 1.0;
            maxBuses = st.maxBuses ?? 12;
            busSizeScale = st.busSize ?? 1.0;
        } catch(e) {}
    }

    // 賽道中線貝茲曲線定義（平滑環繞 1920x1080 畫面）
    const trackPoints = [
        {x: 300, y: 850},
        {x: 960, y: 920},
        {x: 1620, y: 850},
        {x: 1780, y: 600},
        {x: 1600, y: 350},
        {x: 960, y: 220},
        {x: 320, y: 350},
        {x: 140, y: 600}
    ];

    // 產生平滑賽道點對（Arc-length parameterized）
    function getBezierPoint(t) {
        // 封閉式平滑曲線插值 (Catmull-Rom / B-Spline approach)
        const n = trackPoints.length;
        const scaledT = t * n;
        const i = Math.floor(scaledT) % n;
        const nextI = (i + 1) % n;
        const nextNextI = (i + 2) % n;
        const prevI = (i - 1 + n) % n;
        const localT = scaledT - i;

        // Catmull-Rom spline
        const p0 = trackPoints[prevI];
        const p1 = trackPoints[i];
        const p2 = trackPoints[nextI];
        const p3 = trackPoints[nextNextI];

        const tt = localT * localT;
        const ttt = tt * localT;

        const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * localT + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * tt + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * ttt);
        const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * localT + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * tt + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * ttt);

        // 切向量計算方向角
        const dt = 0.001;
        const nextPos = getRawPoint(t + dt > 1 ? t + dt - 1 : t + dt);
        const dx = nextPos.x - x;
        const dy = nextPos.y - y;
        const angle = Math.atan2(dy, dx);

        return {x, y, angle};
    }

    function getRawPoint(t) {
        const n = trackPoints.length;
        const scaledT = t * n;
        const i = Math.floor(scaledT) % n;
        const nextI = (i + 1) % n;
        const nextNextI = (i + 2) % n;
        const prevI = (i - 1 + n) % n;
        const localT = scaledT - i;
        const p0 = trackPoints[prevI], p1 = trackPoints[i], p2 = trackPoints[nextI], p3 = trackPoints[nextNextI];
        const tt = localT * localT, ttt = tt * localT;
        const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * localT + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * tt + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * ttt);
        const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * localT + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * tt + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * ttt);
        return {x, y};
    }

    // 繪製精準的黃色校車向量圖形 (配合圖片結構)
    const busImageCache = {};
    function drawSchoolBus(ctx, width, height, customColor, imgUrl) {
        ctx.save();
        ctx.scale(width / 220, height / 130); // 基準尺寸 220x130

        if (imgUrl) {
            if (!busImageCache[imgUrl]) {
                const img = new Image();
                img.src = imgUrl;
                busImageCache[imgUrl] = img;
            }
            const img = busImageCache[imgUrl];
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -110, -65, 220, 130);
                ctx.restore();
                return;
            }
        }

        // 車身主體顏色
        const bodyColor = customColor || '#fbc02d';

        // 1. 車頂行李架 / 頂蓋
        ctx.fillStyle = '#546e7a';
        ctx.beginPath();
        ctx.roundRect(-50, -60, 130, 14, 4);
        ctx.fill();

        // 2. 車身主體輪廓（符合經典校車弧形引擎蓋與車體）
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.moveTo(-90, 45);
        ctx.lineTo(-90, 20);
        ctx.lineTo(-100, -5);    // 引擎蓋前緣
        ctx.lineTo(-75, -45);    // 前擋風玻璃斜角
        ctx.lineTo(80, -48);     // 車頂線
        ctx.quadraticCurveTo(105, -48, 105, -20);
        ctx.lineTo(105, 45);     // 車尾
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#37474f';
        ctx.stroke();

        // 3. 側邊裝飾雙條紋 (經典校車棕色腰線)
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(-90, 5, 200, 7);
        ctx.fillRect(-90, 20, 200, 6);

        // 4. 車窗（4扇經典方窗與前擋風玻璃）
        // 前擋風玻璃
        ctx.fillStyle = '#b3e5fc';
        ctx.beginPath();
        ctx.moveTo(-73, -40);
        ctx.lineTo(-52, -40);
        ctx.lineTo(-52, 2);
        ctx.lineTo(-88, 2);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#37474f';
        ctx.stroke();

        // 4扇側窗
        const windowWidth = 24;
        const windowHeight = 26;
        const windowY = -38;
        const windowXStarts = [-40, -10, 20, 50];
        
        windowXStarts.forEach(wx => {
            ctx.fillStyle = '#b3e5fc';
            ctx.fillRect(wx, windowY, windowWidth, windowHeight);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#37474f';
            ctx.strokeRect(wx, windowY, windowWidth, windowHeight);
        });

        // 5. 前視鏡
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-85, -30, 8, 18);
        ctx.fillRect(-89, -35, 12, 6);

        // 6. 車底儲物箱/防撞桿
        ctx.fillStyle = '#90a4ae';
        ctx.fillRect(-25, 32, 50, 15);
        ctx.fillRect(-102, 45, 207, 7); // 前後保險桿
        ctx.fillRect(85, 22, 15, 6);   // 車尾標誌

        // 7. 輪胎 (前後大車輪連白色輪圈)
        const wheels = [-55, 55];
        wheels.forEach(wx => {
            // 外框黑輪胎
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.arc(wx, 50, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#424242';
            ctx.stroke();

            // 白色內輪圈
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.arc(wx, 50, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#616161';
            ctx.stroke();
        });

        ctx.restore();
    }

    // 背景風景繪製
    function drawBackground() {
        // 天空漸層
        const skyGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
        skyGrad.addColorStop(0, '#4fc3f7');
        skyGrad.addColorStop(0.7, '#b3e5fc');
        skyGrad.addColorStop(1, '#e1f5fe');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 遠山
        ctx.fillStyle = '#81c784';
        ctx.beginPath();
        ctx.moveTo(0, 750);
        ctx.lineTo(0, 500);
        ctx.quadraticCurveTo(300, 320, 650, 500);
        ctx.quadraticCurveTo(1100, 300, 1500, 480);
        ctx.quadraticCurveTo(1750, 400, 1920, 520);
        ctx.lineTo(1920, 750);
        ctx.fill();

        // 綠野草地
        ctx.fillStyle = '#aed581';
        ctx.fillRect(0, 700, LOGICAL_WIDTH, LOGICAL_HEIGHT - 700);

        // 藍色大湖泊
        ctx.fillStyle = '#29b6f6';
        ctx.beginPath();
        ctx.ellipse(960, 600, 380, 140, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#0288d1';
        ctx.stroke();

        // 小木屋與風車裝飾
        drawCottage(400, 520);
        drawWindmill(1480, 480);

        // 賽道外邊界與草地跑道
        ctx.beginPath();
        for (let t = 0; t <= 1; t += 0.002) {
            const pt = getBezierPoint(t);
            if (t === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.lineWidth = 140;
        ctx.strokeStyle = '#795548'; // 賽道外框/泥土邊界
        ctx.stroke();

        ctx.lineWidth = 120;
        ctx.strokeStyle = '#e0e0e0'; // 灰色柏油路面
        ctx.stroke();

        // 賽道中心虛線
        ctx.lineWidth = 6;
        ctx.setLineDash([25, 25]);
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.setLineDash([]); // 重設虛線

        // 起點 / 終點拱門
        drawStartArch(300, 850);
    }

    function drawCottage(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // 屋身
        ctx.fillStyle = '#ffccbc';
        ctx.fillRect(-35, -20, 70, 45);
        // 屋頂
        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.moveTo(-45, -20);
        ctx.lineTo(0, -60);
        ctx.lineTo(45, -20);
        ctx.closePath();
        ctx.fill();
        // 門窗
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(-10, 5, 20, 20);
        ctx.fillRect(-28, -10, 14, 14);
        ctx.fillRect(14, -10, 14, 14);
        ctx.restore();
    }

    function drawWindmill(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // 塔身
        ctx.fillStyle = '#eceff1';
        ctx.beginPath();
        ctx.moveTo(-25, 80);
        ctx.lineTo(-12, -40);
        ctx.lineTo(12, -40);
        ctx.lineTo(25, 80);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#37474f';
        ctx.stroke();

        // 風車葉片旋轉動畫
        const angle = Date.now() * 0.0015;
        ctx.translate(0, -35);
        ctx.rotate(angle);
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath();
            ctx.rect(0, -6, 55, 12);
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawStartArch(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // 拱門左右支柱
        ctx.fillStyle = '#1565c0';
        ctx.fillRect(-70, -110, 20, 110);
        ctx.fillRect(50, -110, 20, 110);
        // 頂部橫額
        ctx.fillStyle = '#0d47a1';
        ctx.fillRect(-90, -140, 180, 40);
        ctx.fillStyle = '#ffeb3b';
        ctx.font = 'bold 22px "Microsoft JhengHei"';
        ctx.textAlign = 'center';
        ctx.fillText('🏁 巡遊起終點', 0, -113);
        ctx.restore();
    }

    // 主循環渲染
    function updateAndRender() {
        ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 1. 繪製背景與賽道
        drawBackground();

        // 2. 更新與繪製車隊
        const activeBuses = buses.filter(b => !b.hidden).slice(0, maxBuses);
        const speedStep = 0.00012 * busSpeed;

        activeBuses.forEach((bus, index) => {
            if (bus.dist === undefined) {
                bus.dist = (index / Math.max(1, activeBuses.length));
            }
            bus.dist += speedStep * (bus.speedMul || 1.0);
            if (bus.dist > 1.0) bus.dist -= 1.0;

            const pos = getBezierPoint(bus.dist);
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            // 檢查是否為聚焦車輛
            const isFocused = (bus.id === focusedBusId && focusTimer > 0);
            if (isFocused) {
                ctx.scale(1.4 * busSizeScale, 1.4 * busSizeScale);
                // 閃耀光環特效
                ctx.beginPath();
                ctx.arc(0, 0, 85, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 235, 59, 0.4)';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ff9800';
                ctx.stroke();
            } else {
                ctx.scale(busSizeScale, busSizeScale);
            }

            // 繪製黃色校車
            drawSchoolBus(ctx, 160, 95, bus.color, bus.imgUrl);

            // 姓名標籤（保持水平不旋轉）
            ctx.rotate(-pos.angle);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.beginPath();
            ctx.roundRect(-70, -75, 140, 30, 15);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffeb3b';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Microsoft JhengHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bus.name || '黃色巴士', 0, -60);

            ctx.restore();
        });

        if (focusTimer > 0) focusTimer--;

        requestAnimationFrame(updateAndRender);
    }

    requestAnimationFrame(updateAndRender);

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {});
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>
</body>
</html>
