<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃色巴士大巡遊 - 大銀幕展示端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b1329; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
        
        #stage-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            transform: translate(-50%, -50%);
            background: #87CEEB;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        @media (min-aspect-ratio: 16/9) {
            #stage-container { width: 177.78vh; height: 100vh; }
        }

        canvas { display: block; width: 100%; height: 100%; }

        .top-bar {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .badge {
            background: rgba(0, 0, 0, 0.6);
            color: #ffeb3b;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 235, 59, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .nav-links { pointer-events: auto; display: flex; gap: 10px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
